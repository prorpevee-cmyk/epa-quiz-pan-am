<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#001428">
<meta name="robots" content="noindex,nofollow">
<title>Quiz EPA · Comissários</title>
<meta name="description" content="Descubra o que desenvolver para atuar na aviação executiva. Responda a seis perguntas no quiz da EPA.">
<link rel="icon" href="../epa-logo.png">
<style>html,body{margin:0;padding:0;background:#f5f6f8}.cursor-interaction{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #4386c3;outline-offset:4px}</style>
</head>
<body>
<div id="epa-quiz-preview">
  <style>
    @font-face{font-family:EpaJakarta;src:url('../jakarta-400.ttf') format('truetype');font-weight:400;font-display:swap}
    @font-face{font-family:EpaJakarta;src:url('../jakarta-500.ttf') format('truetype');font-weight:500;font-display:swap}
    @font-face{font-family:EpaInter;src:url('../inter-400.ttf') format('truetype');font-weight:400 500;font-display:swap}
    #epa-quiz-preview{--epa-navy:#001428;--epa-ink:#102b43;--epa-red:#b60000;--epa-paper:#f5f6f8;--epa-muted:#5d6c7c;--epa-line:#d9e0e7;background:var(--epa-paper);color:var(--epa-ink);font:400 14px/1.65 EpaInter,Arial,sans-serif;-webkit-font-smoothing:antialiased;color-scheme:light}
    #epa-quiz-preview *{box-sizing:border-box}
    #epa-quiz-preview h1,#epa-quiz-preview h2,#epa-quiz-preview h3,#epa-quiz-preview p{margin:0}
    #epa-quiz-preview button,#epa-quiz-preview input{font:inherit}
    #epa-quiz-preview .epa-layout{display:grid;grid-template-columns:minmax(0,43%) minmax(0,57%);min-height:880px}
    #epa-quiz-preview .epa-brand{position:relative;isolation:isolate;overflow:hidden;background:var(--epa-navy);color:#fff;padding:38px clamp(36px,4.5vw,80px);min-height:880px}
    #epa-quiz-preview .epa-logo{width:150px;height:auto;display:block;margin-left:-13px}
    #epa-quiz-preview .epa-photo{position:absolute;z-index:-2;bottom:0;left:0;width:100%;height:58%;object-fit:cover;object-position:48% 50%;opacity:.82;mask-image:linear-gradient(transparent 0%,#000 55%)}
    #epa-quiz-preview .epa-brand:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 50%,#00142820 75%,#001428a6 100%);pointer-events:none}
    #epa-quiz-preview .epa-brand-copy{margin-top:62px;max-width:470px}
    #epa-quiz-preview .epa-red-line{display:block;width:38px;height:3px;background:#da2c31;margin-bottom:26px}
    #epa-quiz-preview .epa-brand h1{font:400 clamp(34px,3vw,47px)/1.12 EpaJakarta,Arial,sans-serif;letter-spacing:-1.65px;text-wrap:balance;color:#ffffff!important;-webkit-text-fill-color:#ffffff}
    #epa-quiz-preview .epa-brand-copy p{font-size:15px;line-height:1.8;color:#c3d1df;max-width:370px;margin-top:23px}
    #epa-quiz-preview .epa-main{min-width:0;display:flex;align-items:center;padding:34px clamp(28px,5.5vw,100px) 24px}
    #epa-quiz-preview .epa-stage{width:100%;max-width:620px;margin:auto;padding:58px 0 46px}
    #epa-quiz-preview .epa-counter{display:flex;justify-content:flex-end;font-size:11px;color:var(--epa-muted);margin-bottom:14px}
    #epa-quiz-preview .epa-progress{height:3px;background:#dce3e9;margin-bottom:35px}
    #epa-quiz-preview .epa-progress span{display:block;height:100%;background:var(--epa-red);transition:width .2s}
    #epa-quiz-preview h2{font:500 32px/1.2 EpaJakarta,Arial,sans-serif;letter-spacing:-1.25px;text-wrap:balance;margin-bottom:30px;color:var(--epa-ink);-webkit-text-fill-color:var(--epa-ink)}
    #epa-quiz-preview fieldset{padding:0;border:0;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
    #epa-quiz-preview .epa-option{position:relative;display:flex;align-items:center;gap:15px;padding:20px 18px;min-height:80px;border:1px solid #d4dce4;background:#fff;border-radius:5px;transition:border-color .15s,background .15s}
    #epa-quiz-preview .epa-option:hover{border-color:#8eabc5;background:#f9fbfd}
    #epa-quiz-preview .epa-option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}
    #epa-quiz-preview .epa-letter{width:27px;height:27px;flex:none;border:1px solid #ccd6df;display:grid;place-items:center;font-size:11px;border-radius:3px;color:#627386}
    #epa-quiz-preview .epa-option-text{font-size:14px;line-height:1.6}
    #epa-quiz-preview .epa-check{margin-left:auto;color:var(--epa-red);opacity:0;font-size:18px}
    #epa-quiz-preview .epa-option:has(input:checked){border-color:var(--epa-red);background:#fffafa;box-shadow:0 0 0 1px var(--epa-red)}
    #epa-quiz-preview .epa-option:has(input:checked) .epa-letter{background:var(--epa-red);border-color:var(--epa-red);color:#fff}
    #epa-quiz-preview .epa-option:has(input:checked) .epa-check{opacity:1}
    #epa-quiz-preview .epa-option:has(input:focus-visible){outline:3px solid #4386c3;outline-offset:3px}
    #epa-quiz-preview .epa-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:30px}
    #epa-quiz-preview .epa-primary{display:inline-flex;align-items:center;justify-content:space-between;gap:26px;padding:18px 23px;min-height:58px;min-width:195px;border:1px solid transparent;border-radius:4px;background:var(--epa-red);color:#fff;text-decoration:none;font:500 14px/1.5 EpaInter,Arial,sans-serif;transition:background .18s;margin-left:auto}
    #epa-quiz-preview .epa-primary:hover{background:#cf181e}
    #epa-quiz-preview .epa-primary:disabled{background:#e4e8ed;color:#6b7783;cursor:not-allowed}
    #epa-quiz-preview .epa-arrow{font-size:22px;line-height:1}
    #epa-quiz-preview .epa-back{display:inline-flex;align-items:center;gap:9px;background:none;color:var(--epa-muted);border:0;padding:12px 0;font-size:12px}
    #epa-quiz-preview .epa-text{color:var(--epa-muted);font-size:13px;line-height:1.8}
    #epa-quiz-preview .epa-contact h2{margin-bottom:15px}
    #epa-quiz-preview .epa-contact-form{display:grid;gap:17px;margin-top:24px}
    #epa-quiz-preview .epa-field{display:grid;gap:7px;font-size:12px}
    #epa-quiz-preview .epa-field input{width:100%;min-width:0;font-size:16px;line-height:1.5;padding:13px 14px;border:1px solid #b9c8d6;border-radius:4px;background:#fff;color:var(--epa-ink);min-height:50px}
    #epa-quiz-preview .epa-optional{font-size:11px;color:var(--epa-muted)}
    #epa-quiz-preview .epa-two-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    #epa-quiz-preview .epa-consent{display:flex;gap:11px;align-items:flex-start;font-size:11px;line-height:1.8;color:var(--epa-muted)}
    #epa-quiz-preview .epa-consent input{width:18px;height:18px;margin:3px 0 0;flex:none;accent-color:var(--epa-red)}
    #epa-quiz-preview .epa-contact-form .epa-nav{margin-top:4px}
    #epa-quiz-preview .epa-note{font-size:11px;line-height:1.8;color:var(--epa-muted)}
    #epa-quiz-preview .epa-eyebrow{display:flex;align-items:center;gap:11px;color:var(--epa-muted);font-size:12px;margin-bottom:21px}
    #epa-quiz-preview .epa-result-check{display:grid;place-items:center;background:#e7edf2;color:#244969;width:33px;height:33px;border-radius:50%;font-size:17px}
    #epa-quiz-preview .epa-priorities{list-style:none;padding:0;margin:0 0 27px}
    #epa-quiz-preview .epa-priorities li{display:flex;gap:17px;padding:17px 0;border-bottom:1px solid var(--epa-line)}
    #epa-quiz-preview .epa-priority-number{font-family:EpaJakarta,Arial,sans-serif;font-size:13px;color:var(--epa-red);padding-top:1px}
    #epa-quiz-preview .epa-priorities h3{font:500 14px/1.5 EpaJakarta,Arial,sans-serif;letter-spacing:-.2px;color:var(--epa-ink);-webkit-text-fill-color:var(--epa-ink)}
    #epa-quiz-preview .epa-priorities p{font-size:12px;line-height:1.8;color:var(--epa-muted);margin-top:6px}
    #epa-quiz-preview .epa-invitation{background:var(--epa-navy);color:#fff;padding:25px 24px;border-radius:5px}
    #epa-quiz-preview .epa-invitation h3{font:500 21px/1.4 EpaJakarta,Arial,sans-serif;letter-spacing:-.5px;color:#ffffff!important;-webkit-text-fill-color:#ffffff}
    #epa-quiz-preview .epa-invitation p{font-size:12px;color:#bdcbd9;line-height:1.8;margin-top:12px}
    #epa-quiz-preview .epa-invitation .epa-primary{margin-top:22px;width:100%;font-size:12px;padding-inline:17px}
    #epa-quiz-preview .epa-scope{font-size:11px;line-height:1.8;color:var(--epa-muted);margin-top:18px}
    #epa-quiz-preview .epa-result-actions{display:flex;justify-content:space-between;gap:18px;margin-top:22px}
    #epa-quiz-preview .epa-text-button{border:0;border-bottom:1px solid #9eacb9;padding:2px 0;background:none;color:var(--epa-ink);font-size:11px}
    #epa-quiz-preview .epa-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(min-width:1600px){#epa-quiz-preview .epa-main{padding-inline:100px}#epa-quiz-preview .epa-brand h1{font-size:50px}}
    @media(max-width:1100px){#epa-quiz-preview .epa-brand{padding-inline:33px}#epa-quiz-preview .epa-main{padding-inline:35px}#epa-quiz-preview .epa-brand h1{font-size:36px}}
    @media(min-width:601px) and (max-width:900px){#epa-quiz-preview .epa-brand{padding:30px 24px}#epa-quiz-preview .epa-logo{width:130px;margin-left:-11px}#epa-quiz-preview .epa-brand-copy{margin-top:54px}#epa-quiz-preview .epa-brand h1{font-size:clamp(27px,4vw,34px);letter-spacing:-1.1px}#epa-quiz-preview .epa-brand-copy p{font-size:13px;line-height:1.8;margin-top:22px}#epa-quiz-preview .epa-main{padding:28px 24px}#epa-quiz-preview .epa-stage{padding:38px 0}#epa-quiz-preview h2{font-size:27px;letter-spacing:-1px}#epa-quiz-preview .epa-option{gap:11px;padding:17px 13px}#epa-quiz-preview .epa-option-text{font-size:13px}#epa-quiz-preview .epa-letter{width:24px;height:24px}#epa-quiz-preview .epa-primary{min-width:175px;padding:16px;gap:18px;font-size:13px}#epa-quiz-preview .epa-nav{gap:12px}#epa-quiz-preview .epa-two-fields{grid-template-columns:1fr}#epa-quiz-preview .epa-invitation{padding:23px 20px}#epa-quiz-preview .epa-invitation .epa-primary{min-width:0}#epa-quiz-preview .epa-result-actions{flex-wrap:wrap}}
    @media(max-width:600px){#epa-quiz-preview .epa-layout{grid-template-columns:minmax(0,43%) minmax(0,57%);min-height:780px}#epa-quiz-preview .epa-brand{min-width:0;min-height:780px;padding:24px 18px}#epa-quiz-preview .epa-logo{width:120px;max-width:100%;margin-left:-9px}#epa-quiz-preview .epa-brand-copy{margin-top:44px}#epa-quiz-preview .epa-brand h1{font-size:clamp(19px,4.5vw,27px);letter-spacing:-.7px;overflow-wrap:anywhere}#epa-quiz-preview .epa-brand-copy p{font-size:12px;line-height:1.7;margin-top:20px;overflow-wrap:anywhere}#epa-quiz-preview .epa-red-line{margin-bottom:23px;width:30px}#epa-quiz-preview .epa-main{padding:24px 18px}#epa-quiz-preview .epa-stage{padding:24px 0}#epa-quiz-preview h2{font-size:clamp(18px,4.6vw,25px);letter-spacing:-.65px;overflow-wrap:anywhere;margin-bottom:24px}#epa-quiz-preview .epa-progress{margin-bottom:26px}#epa-quiz-preview .epa-option{gap:9px;min-height:78px;padding:14px 11px}#epa-quiz-preview .epa-option-text{font-size:12px;overflow-wrap:anywhere}#epa-quiz-preview .epa-letter{width:20px;height:22px}#epa-quiz-preview .epa-check{font-size:14px}#epa-quiz-preview .epa-primary{min-width:0;max-width:100%;padding:14px 12px;min-height:48px;gap:10px;font-size:12px}#epa-quiz-preview .epa-nav{gap:12px;margin-top:24px;flex-wrap:wrap}#epa-quiz-preview .epa-two-fields{grid-template-columns:1fr}#epa-quiz-preview .epa-invitation{padding:20px 14px}#epa-quiz-preview .epa-invitation h3{font-size:18px;overflow-wrap:anywhere}#epa-quiz-preview .epa-priorities li{gap:10px}#epa-quiz-preview .epa-priorities h3,#epa-quiz-preview .epa-priorities p{overflow-wrap:anywhere}#epa-quiz-preview .epa-result-actions{flex-wrap:wrap}}
    @media(max-width:420px){#epa-quiz-preview .epa-brand{padding:20px 12px}#epa-quiz-preview .epa-main{padding:20px 12px}#epa-quiz-preview .epa-logo{width:100px;margin-left:-6px}#epa-quiz-preview .epa-brand-copy{margin-top:36px}#epa-quiz-preview .epa-brand-copy p{font-size:11px}#epa-quiz-preview .epa-option{padding:13px 9px;gap:6px}#epa-quiz-preview .epa-letter{display:none}#epa-quiz-preview .epa-check{position:absolute;right:4px;top:4px;font-size:11px}#epa-quiz-preview .epa-counter{font-size:11px}#epa-quiz-preview .epa-invitation{padding:17px 11px}#epa-quiz-preview .epa-invitation .epa-primary{padding:12px 8px;gap:6px;overflow-wrap:anywhere}#epa-quiz-preview .epa-result-actions{gap:16px}}
    @media(prefers-reduced-motion:reduce){#epa-quiz-preview *{transition:none!important;scroll-behavior:auto!important}}
  </style>

      <img class="epa-logo" src="../epa-logo-white-preview.png" alt="EPA Training Center" width="380" height="150">
      <div class="epa-brand-copy"><span class="epa-red-line" aria-hidden="true"></span><h1>Descubra o que desenvolver para atuar na aviação executiva.</h1><p>Responda a 6 perguntas e veja quais habilidades priorizar para transformar sua formação em um atendimento de excelência a bordo.</p></div>
    </aside>
    <main class="epa-main"><div class="epa-stage"></div></main>
  </div>
  <div class="epa-status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    const root=document.getElementById('epa-quiz-preview');
    const stage=root.querySelector('.epa-stage');
    const status=root.querySelector('.epa-status');
    const questions=[
      {title:'Qual é o seu momento como comissário?',options:['Concluí a formação há até 6 meses.','Concluí a formação entre 7 e 12 meses.','Concluí a formação há mais de um ano.','Ainda estou cursando.','Estou conhecendo a profissão.']},
      {title:'Você já trabalhou a bordo?',options:['Ainda não tive minha primeira experiência.','Já atuei na aviação comercial.','Já atuei na aviação executiva.','Já atuei na comercial e na executiva.']},
      {title:'A aviação executiva faz parte dos seus planos?',options:['Sim, quero me preparar para atuar nesse segmento.','É uma possibilidade, mas ainda conheço pouco.','Quero entender melhor antes de decidir.','Meu foco, por enquanto, é a aviação comercial.']},
      {title:'Como você se sente para atender em um voo executivo?',options:['Tenho experiência e quero aperfeiçoar meu atendimento.','Conheço a teoria, mas ainda tenho dúvidas na prática.','Preciso me preparar para esse tipo de serviço.','Ainda não conheço bem essa rotina.']},
      {title:'O que você mais quer desenvolver no serviço de bordo?',options:['Perceber as preferências do passageiro e agir com discrição.','Organizar e executar o serviço à mesa.','Planejar o catering e lidar com restrições alimentares.','Resolver imprevistos e situações delicadas.','Ainda preciso entender o que essa rotina exige.']},
      {title:'Quando você pretende dar o próximo passo na sua preparação?',options:['Quero começar nos próximos 30 dias.','Nos próximos 3 meses.','Mais adiante, depois de me organizar.','Estou pesquisando, ainda sem um prazo.']}
    ];
    let answers=Array(6).fill(null);
    const contact={name:'',phone:'',email:'',city:'',consent:false};
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const arrow='<span class="epa-arrow" aria-hidden="true">→</span>';
    function progress(i,label){return '<div class="epa-counter">'+label+'</div><div class="epa-progress" role="progressbar" aria-label="Perguntas respondidas" aria-valuemin="0" aria-valuemax="6" aria-valuenow="'+i+'"><span style="width:'+i/6*100+'%"></span></div>'}
    function announce(text){status.textContent=text;}
    function question(i){
      const q=questions[i];
      stage.innerHTML='<section>'+progress(i,'Pergunta '+(i+1)+' de 6')+'<h2 id="epa-q-title">'+q.title+'</h2><form class="epa-question-form"><fieldset aria-labelledby="epa-q-title">'+q.options.map((o,j)=>'<label class="epa-option cursor-interaction"><input class="cursor-interaction" type="radio" name="choice" value="'+j+'" '+(answers[i]===j?'checked':'')+' required><span class="epa-letter" aria-hidden="true">'+String.fromCharCode(65+j)+'</span><span class="epa-option-text">'+o+'</span><span class="epa-check" aria-hidden="true">✓</span></label>').join('')+'</fieldset><div class="epa-nav">'+(i>0?'<button class="epa-back cursor-interaction" type="button" data-action="back"><span aria-hidden="true">←</span> Voltar</button>':'')+'<button type="button" data-action="next" class="epa-primary cursor-interaction" '+(answers[i]===null?'disabled':'')+'>Continuar '+arrow+'</button></div></form></section>';
      const form=stage.querySelector('form');
      form.addEventListener('change',e=>{answers[i]=Number(e.target.value);form.querySelector('[data-action="next"]').disabled=false;});
      form.querySelector('[data-action="next"]').addEventListener('click',()=>{if(answers[i]===null)return;i<5?question(i+1):showContact();});
      stage.querySelector('[data-action="back"]')?.addEventListener('click',()=>question(i-1));
      announce('Pergunta '+(i+1)+' de 6. '+q.title);
    }
    function remember(form){for(const key of ['name','phone','email','city'])contact[key]=form.elements[key].value;contact.consent=form.elements.consent.checked;}
    function showContact(){
      stage.innerHTML='<section class="epa-contact">'+progress(6,'Perguntas concluídas')+'<h2>Falta só se identificar.</h2><p class="epa-text">Na versão final, seus dados identificarão as respostas. Nesta prévia, você pode avançar sem preencher os campos.</p><form class="epa-contact-form" novalidate><label class="epa-field">Nome<input name="name" autocomplete="off" placeholder="Seu nome" maxlength="100" value="'+escape(contact.name)+'"></label><label class="epa-field">WhatsApp com DDD<input name="phone" type="tel" autocomplete="off" placeholder="(41) 99999-9999" maxlength="22" value="'+escape(contact.phone)+'"></label><div class="epa-two-fields"><label class="epa-field"><span>E-mail <span class="epa-optional">(opcional)</span></span><input name="email" type="email" autocomplete="off" placeholder="seu@email.com" maxlength="150" value="'+escape(contact.email)+'"></label><label class="epa-field"><span>Cidade / UF <span class="epa-optional">(opcional)</span></span><input name="city" autocomplete="off" placeholder="Curitiba / PR" maxlength="100" value="'+escape(contact.city)+'"></label></div><label class="epa-consent cursor-interaction"><input name="consent" type="checkbox" '+(contact.consent?'checked':'')+'><span>Quero receber informações da EPA sobre preparação e oportunidades de treinamento. (Opcional.)</span></label><p class="epa-note">Prévia para revisão: esta versão não envia nem armazena respostas. Você pode ver o resultado sem preencher seus dados.</p><div class="epa-nav"><button type="button" class="epa-back cursor-interaction" data-action="back"><span aria-hidden="true">←</span> Voltar</button><button type="button" data-action="finish" class="epa-primary cursor-interaction">Ver meu resultado '+arrow+'</button></div></form></section>';
      const form=stage.querySelector('form');
      form.querySelector('[data-action="finish"]').addEventListener('click',()=>{remember(form);showResult();});
      stage.querySelector('[data-action="back"]').addEventListener('click',()=>{remember(form);question(5);});
      announce('Perguntas concluídas. Identificação.');
    }
    function result(){
      const a=answers;let label='Da formação à prática',profile='praticar';
      if(a[0]>=3||a[2]>=2||a[3]===3){label='Explorando o próximo passo';profile='explorar';}
      else if(a[1]>0&&a[3]===0){label='Aperfeiçoando seu atendimento';profile='aperfeicoar';}
      const priorities=[];
      if(profile==='explorar')priorities.push({title:'Entender o caminho que faz sentido para você',text:a[2]===3?'Seu foco hoje está na aviação comercial. Conhecer as diferenças da executiva pode ajudar a avaliar esse segmento em outro momento, sem mudar seu plano agora.':a[0]>=3?'Sua prioridade agora é construir a base da profissão. Conhecer os diferentes segmentos ajuda a direcionar os próximos passos da formação.':'Antes de escolher uma preparação, conheça a rotina da aviação executiva e compare suas exigências com a carreira que você busca.'});
      else if(profile==='aperfeicoar')priorities.push({title:'Usar sua experiência como ponto de partida',text:'Escolha situações reais do seu atendimento para revisar o que já funciona e identificar onde você quer ganhar mais consistência.'});
      else priorities.push({title:'Transformar conhecimento em execução',text:a[1]===0?'Você já tem uma base de formação. O próximo passo é praticar situações do serviço de bordo e aplicar esse conhecimento no atendimento.':'Sua experiência a bordo é um ponto de partida. Agora, vale conhecer e praticar as particularidades do atendimento na aviação executiva.'});
      priorities.push([
        {title:'Ler o passageiro e preservar a discrição',text:'Observe como preferências, privacidade e contexto do voo orientam a forma de atender. Antecipar uma necessidade também exige saber quando dar espaço.'},
        {title:'Ganhar prática no serviço à mesa',text:'Trabalhe a organização, a sequência do serviço e o cuidado com a apresentação, considerando o espaço e os recursos disponíveis a bordo.'},
        {title:'Planejar o serviço antes do embarque',text:'Aprenda a levantar preferências e restrições, organizar o catering e conferir o que será necessário para executar o atendimento.'},
        {title:'Treinar a resposta a imprevistos',text:'Pratique como ouvir, comunicar uma limitação e buscar uma solução com discrição quando algo não acontece como o planejado.'},
        {title:'Conhecer a rotina da aviação executiva',text:'Entenda como o preparo antes do voo, a personalização do serviço e a atenção aos detalhes fazem parte do trabalho nesse segmento.'}
      ][a[4]]);
      priorities.push({title:a[5]<=1?'Organizar uma preparação com prazo':'Definir o próximo passo com clareza',text:a[5]===0?'Como você quer começar em até 30 dias, levante as habilidades que precisa praticar, a disponibilidade na agenda e as opções de preparação.':a[5]===1?'Use os próximos três meses para comparar programas, entender o que é praticado e organizar sua disponibilidade.':'Antes de escolher uma data, entenda o que deseja desenvolver e quais experiências práticas podem ajudar no seu objetivo.'});
      return {label,priorities};
    }
    function showResult(){
      const r=result();
      stage.innerHTML='<section><div class="epa-eyebrow"><span class="epa-result-check" aria-hidden="true">✓</span>Seu resultado</div><h2>'+r.label+'</h2><ol class="epa-priorities">'+r.priorities.map((p,i)=>'<li><span class="epa-priority-number">0'+(i+1)+'</span><div><h3>'+p.title+'</h3><p>'+p.text+'</p></div></li>').join('')+'</ol><div class="epa-invitation"><h3>Excelência no Serviço de Bordo</h3><p>Se a aviação executiva está nos seus planos, conheça a preparação da EPA para o atendimento a bordo.</p><a class="epa-primary cursor-interaction" href="https://www.epa.aero/excelencia-servico-de-bordo.html" target="_blank" rel="noopener">Conhecer o programa '+arrow+'</a></div><p class="epa-scope">Este resultado organiza prioridades a partir das suas respostas. Não é uma avaliação técnica nem uma garantia de contratação.</p><div class="epa-result-actions"><button class="epa-text-button cursor-interaction" type="button" data-action="review">Rever minhas respostas</button><button class="epa-text-button cursor-interaction" type="button" data-action="restart">Refazer o quiz</button></div></section>';
      stage.querySelector('[data-action="review"]').addEventListener('click',showReview);
      stage.querySelector('[data-action="restart"]').addEventListener('click',()=>{answers=Array(6).fill(null);for(const k of ['name','phone','email','city'])contact[k]='';contact.consent=false;question(0);});
      announce('Seu resultado. '+r.label);
    }
    function showReview(){
      stage.innerHTML='<section><div class="epa-eyebrow">Seu registro</div><h2>Suas respostas</h2><ol class="epa-priorities">'+questions.map((q,i)=>'<li><span class="epa-priority-number">0'+(i+1)+'</span><div><h3>'+q.title+'</h3><p>'+q.options[answers[i]]+'</p></div></li>').join('')+'</ol><button type="button" class="epa-primary cursor-interaction" data-action="return">Voltar ao resultado '+arrow+'</button></section>';
      stage.querySelector('[data-action="return"]').addEventListener('click',showResult);announce('Revisão das suas seis respostas.');
    }
    question(0);
  })();
  </script>
</div>
